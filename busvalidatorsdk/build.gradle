/*plugins {
    alias(libs.plugins.android.application)

}*/

apply plugin: 'com.android.library'

android {
    namespace 'com.dtca.busvalidator.busvalidatorsdk'
    compileSdk 34

    defaultConfig {
//        applicationId "com.dtca.busvalidator.busvalidatorsdk"
        minSdk 27
        targetSdk 34
        versionCode 2
        versionName "1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
tasks.register('javadoc', Javadoc) {
    source = android.sourceSets.main.java.srcDirs

    // Use File.pathSeparator for cross-platform compatibility
    classpath += files(android.getBootClasspath())

    doFirst {
        classpath += files(android.libraryVariants.collect { variant ->
            variant.javaCompileProvider.get().classpath.files
        })
    }

    destinationDir = file("${project.buildDir}/outputs/javadoc/")
    failOnError = false

    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        links "http://docs.oracle.com/javase/8/docs/api/"
        addStringOption('Xdoclint:none', '-quiet')
    }

    exclude '**/BuildConfig.java'
    exclude '**/R.java'
}
dependencies {

    implementation libs.appcompat
    implementation libs.activity
    implementation libs.security.crypto
    implementation libs.gson

    implementation libs.bcprov.jdk15to18

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}



